groups:
  - name: dataflow_critical_alerts
    rules:
      - alert: KafkaConsumerHighLag
        expr: sum(kafka_consumer_lag) by (consumergroup, topic) > 5000
        for: 2m
        labels:
          severity: critical
          tier: streaming
        annotations:
          summary: "Kafka consumer lag exceeding 5,000 unread messages"
          description: "Consumer group '{{ $labels.consumergroup }}' on topic '{{ $labels.topic }}' is dropping behind ingestion rate."

      - alert: HikariConnectionPoolExhaustion
        expr: (hikaricp_connections_active / hikaricp_connections_max) > 0.85
        for: 1m
        labels:
          severity: warning
          tier: database
        annotations:
          summary: "Database connection pool utilization above 85%"
          description: "Active Hikari connections are nearing capacity. Incoming REST API calls risk HTTP 503 timeouts."

      - alert: HighApiLatencyP99
        expr: histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket[5m])) by (le)) > 0.250
        for: 3m
        labels:
          severity: warning
          tier: backend
        annotations:
          summary: "API p99 latency exceeded 250ms SLA"
          description: "99th percentile response time is {{ $value }}s across the last 5 minutes."
