name: DataFlow CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Automated Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Sample Dataset & Quality Audit
        run: |
          python data/inspect_dataset.py data/samples/zomato_restaurants.csv

      - name: Build & Test Java Modules (Ingestion, Spark Jobs, Spring Boot Backend)
        run: |
          mvn clean test --batch-mode

      - name: Install & Build React TypeScript Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Verify dbt Project & Models
        run: |
          python -c "
          import glob
          models = glob.glob('dbt/models/**/*.sql', recursive=True)
          print(f'Discovered {len(models)} dbt SQL transformation models:')
          for m in sorted(models):
              print(f'  - {m}')
          assert len(models) >= 4, f'Expected at least 4 models, found {len(models)}'
          with open('dbt/dbt_project.yml', 'r') as f:
              content = f.read()
              assert 'dataflow_analytics' in content
          with open('dbt/models/marts/marts_schema.yml', 'r') as f:
              content = f.read()
              assert 'dim_restaurant' in content
          print('All dbt SQL models and schema configurations verified successfully.')
          "
