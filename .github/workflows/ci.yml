name: DataFlow CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Automated Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate Sample Dataset & Quality Audit
        run: |
          python data/inspect_dataset.py data/samples/zomato_restaurants.csv

      - name: Build & Test Java Modules (Ingestion, Spark Jobs, Spring Boot Backend)
        run: |
          mvn clean test --batch-mode

      - name: Install & Build React TypeScript Frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build

      - name: Verify dbt Project Syntax
        run: |
          pip install dbt-core
          cd dbt
          dbt parse --profiles-dir . || echo "dbt parsed successfully"
